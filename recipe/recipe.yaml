schema_version: 1

context:
  version: "2.0.33"

package:
  name: cloudsmith-api
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudsmith-api/cloudsmith_api-${{ version }}.tar.gz
  sha256: 26df0718f5b0a765b20270889774421f6b2674ce0dfdf7ed789277e818716c8d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
    - wheel >=0.45
  run:
    - python >=${{ python_min }}
    - certifi >=2017.4.17
    - python-dateutil >=2.1
    - six >=1.10
    - urllib3 >=1.23

tests:
  - python:
      imports:
        - cloudsmith_api
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  homepage: https://cloudsmith.com
  repository: https://github.com/cloudsmith-io/cloudsmith-api
  license: Apache-2.0
  license_file: LICENSE
  summary: Python bindings for the Cloudsmith API

extra:
  recipe-maintainers:
    - BartoszBlizniak
